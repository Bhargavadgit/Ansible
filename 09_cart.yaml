- name: cart_server
  hosts: cart
  become: yes
  tasks:
  - name: dnf module disable nodejs -y
    dnf: 
     name: nodejs
     state: absent
  - name: dnf module enable nodejs:24 -y
    command: dnf module enable nodejs:24 -y
  - name: install nodejs  
    dnf:
     name: nodejs
     state: present
  - name: user added to cart  
    ansible.builtin.user:
     name: roboshop
     system: yes
     home: /app
     shell: /sbin/nologin
     create_home: false 
     comment: roboshop system user
  - name: remove old dir
    ansible.builtin.file:
     path: /app
     state: absent   
  - name: remove old file
    ansible.builtin.file:
     path: /tmp/cart.zip
     state: absent  
  - name: create dir
    ansible.builtin.file:
     path: /app
     state: directory
  - name: Download file into a directory
    ansible.builtin.get_url:
     url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-v4.zip
     dest: /tmp/cart.zip 
  - name: unzip applications
    ansible.builtin.unarchive:
     src: /tmp/cart.zip 
     dest: /app 
     remote_src: true
  - name: npm install
    community.general.npm:
    path: /app   
  - name: systemctl daemon-reload
    ansible.builtin.systemd_service:
     daemon_reload: true
  - name:  enable  & start cart
    service:
     name: cart
     state: restart
     enabled: yes       

