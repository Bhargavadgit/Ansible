- name: cart_server
  hosts: cart
  become: yes
  tasks:
  - name: dnf module disable nodejs -y
    dnf: 
     name: nodejs
     state: absent
  - name: dnf module enable nodejs:24 -y
    command: dnf module enable nodejs:24 -y
  - name: install nodejs  
    dnf:
     name: nodejs
     state: present
     