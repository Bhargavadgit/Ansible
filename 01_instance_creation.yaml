- name : instance creation
  hosts: local
  connection: local
  become: no
  vars:
    ami_id: "ami-0055977a6e828a4f4"
    instance_type: "t3.micro"
    # instances :
    #   - mongodb
    #   - redis
    domain_zone: "Z07751372GOQ7XKXVY478"
    domain_name: "bhar92s.store"
  tasks:
  - name: ec2_instance creation
    amazon.aws.ec2_instance:
      image_id: "{{ ami_id }}"
      instance_type: "{{ instance_type }}"
      security_groups:
      - Roboshop-common
      - "Roboshop-mongodb"
      region: us-east-1
      tags:
      name: "Roboshop-mongodb"
      state: present
    #loop: "{{ instances }}"
    when: state == "create"

  - name: R53_creation
    amazon.aws.route53:
      state: present
      zone: "domain_zone"
      record: "domain_name"
      type: A
      ttl: 1
      value: 44.199.192.41





