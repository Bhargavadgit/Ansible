- name : instance creation
  hosts: local
  connection: local
  become: no
  vars:
    ami_id: "ami-0055977a6e828a4f4"
    instance_type: "t3.micro"
    hosted_zone: "Z07751372GOQ7XKXVY478"
    domain_name: "bhar92s.store"
  tasks:
  - name: ec2_instance creation
    amazon.aws.ec2_instance:
      image_id: "{{ ami_id }}"
      instance_type: "{{ instance_type }}"
      security_groups:
      - Roboshop-common
      - "Roboshop-redis"
      region: us-east-1
      tags:
      name: "Roboshop-redis"
      state: present
    #loop: "{{ instances }}"
    when: state == "create"
    register: ec2_instance
  - name: output
    debug:
     msg: "{{ ec2_instance }}"

