-name : instance creation
hosts: local
connection: local
vars:
 -ami_id: "ami-0c55b159cbfafe1f0"
 instance_type: "t3.micro"
 instances :
    -mongodb
     redis
tasks:
  -name: ec2_user creation
  amazon.aws.ec2_instance:
    image_id: "{{ ami_id }}"
    instance_type: "{{ instance_type }}"
    security_groups:
    - Roboshop-common
    - "Roboshop-{{ item }}"
    region: us-east-1
    state: create
    tags:
     Name: "Roboshop-{{ item }}"
loop:"{{ instances  }}"