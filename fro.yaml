- name: frontend server
  hosts: frontend
  become: yes
  tasks:
  - name: disable nginx
    dnf:
    commond: dnf module disable nginx -y
  - name: enable 
    dnf:
     commond: dnf module enable nginx:1.26 -y
  - name: install nginx
    dnf:
     name: nginx
     state: present
  - name: start & enable 
    service:
     name: nginx
     state: started
     enabled: yes
  - name: remove content inside dir
    ansible.builtin.find:
     paths: /usr/share/nginx/html/
     file_type: any
     recursive: true
     hidden: true 
    register: dir_contents
  - name: Remove the found contents
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ dir_contents.files }}"
  - name: download content 
    ansible.builtin.get_url:
     url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/frontend-v4.zip
     dest: /tmp/frontend.zip
  - name: unzip files
    ansible.builtin.unarchive:
     src: /tmp/frontend.zip
     dest: /usr/share/nginx/html
  - name: copy configure file
    template: 
     src: roboshop.conf
     dest: /etc/nginx/default.d/roboshop.conf
  - name: restart
    service:
     name: nginx
     state: restarted

