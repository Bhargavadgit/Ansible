- name: shipping server
  hosts: localhost
  connection: local
  become: yes
  tasks:
  - name: enable maven
    command: dnf module enable maven:3.9 -y
  - name: 
    dnf: 
     name:
     - maven 
     - java-25-openjdk
     - maven-openjdk25
     - mysql
     state: present
  - name: add user to application
    user: 
     name: roboshop
     create_home: false
     system: yes
     home: /app
     shell: /sbin/nologin
     comment: roboshop system user
  - name: remove file in dir
    ansible.builtin.file:
     path: /tmp/shipping.zip
     state: absent   
  - name: remove dir
    ansible.builtin.file:
     path: /app
     state: absent  
  - name: create dir
    ansible.builtin.file:
     path: /app
     state: directory  
  - name: Download package from URL
    ansible.builtin.get_url:
     url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
     dest: /tmp/shipping.zip
  - name: Copy and unzip file 
    ansible.builtin.unarchive:
     src: /tmp/shipping.zip
     dest: /app  
     remote_src: yes
  - name: clean package
    command: mvn clean package
    args:
     chdir: /app

  - name: move target file to shipping file
    ansible.builtin.command:
      cmd: mv target/shipping.jar shipping.jar
    args:
     chdir: /app

  - name: check cities count
    command: mysql -h {{ mysql_host }} -uroot -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) from cities:cities;"
    register: cities_count
    ignore_errors: true

  - name: cities_output
    debug:
     msg: "{{ cities_count }}"  

  - name: load cities if not found
    shell: mysql -h "{{ mysql_host }}" -uroot -p{{ mysql_root_password }} < /app/db/master-data.sql 
    when: cities_count.rc != 0 or cities_count.stdout | int == 0
    
  - name: add user to app
    shell: mysql -h "{{ mysql_host }}" -uroot -p{{ mysql_root_password }} < /app/db/app-user.sql    

  - name: copy service file
    template:
     src: shipping.service.j2
     dest: /etc/systemd/system/shipping.service

  - name: systemctl daemon-reload
    ansible.builtin.systemd_service:
     daemon_reload: true

  - name: enable & restart shipping
    service:
     name: shipping    
     state: restarted
     enabled: true