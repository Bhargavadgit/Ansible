- name: cart_server
  hosts: cart
  become: yes
  tasks:
  - name:  enable maven:3.9 -y
    command: dnf module enable maven:3.9 -y
  - name: install maven java-25-openjdk-devel -y 
    dnf:  
     name:
     - maven
     - java-25-openjdk-devel
     - maven-openjdk25
     - mysql  
     state: present
  - name: adding application user
    ansible.builtin.user:
     name: roboshop
     system: yes
     home: /app   
     shell: /sbin/nologin
     comment: roboshop system user
     create_home: false
  - name: remove old dir
    ansible.builtin.file:
     path: /app
     state: absent   
  - name: remove old file
    ansible.builtin.file:
     path: /tmp/shipping.zip
     state: absent 
  - name: create new dir
    ansible.builtin.file:
     path: /app
     state: directory
  - name: download dir
    ansible.builtin.get_url:
     url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
     dest: /tmp/shipping.zip  
  - name: unzipping
    ansible.builtin.unarchive:
     src: /tmp/shipping.zip 
     dest: /app
     remote_src: true  
  - name: npm install
    community.general.npm:
     path: /app   
  - name: mvn clean package
    ansible.builtin.command:
     cmd: mvn clean package
     chdir: /app  
  - name: Move the JAR file using Linux mv
    ansible.builtin.command: mv target/shipping.jar shipping.jar
    args:
     chdir: /app
  - name: check cities loaded or not 
    shell: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
    register: cities_count
  - name: loading cities
    shell: mysql -h {{ mysql_host }} -uroot -pRoboShop@1 < /app/db/master-data.sql
    when: cities_count.stdout | int == 0 
  - name: create app user
    shell: mysql -h {{ mysql_host }} -uroot -pRoboShop@1 < /app/db/app-user.sql
  - name: coping shiping service
    ansible.builtin.template:
     src: shipping.service.j2
     dest: /etc/systemd/system/shipping.service
  - name: systemctl daemon-reload
    ansible.builtin.systemd_service:
     daemon_reload: true
  - name:  enable  & start shipping
    service:
     name: shipping
     state: restarted
     enabled: yes       


      

           


