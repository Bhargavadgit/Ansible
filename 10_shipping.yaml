- name: shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: enable maven
    command: dnf module enable maven:3.9 -y
  - name: 
    dnf: 
     name:
     - maven 
     - java-25-openjdk
     - maven openjdk25 
     - mysql
    state: present
  - name: add user to application
    user: 
     name: roboshop
     create_home: false
     system: yes
     home: /app
     shell: /sbin/nologin
     comment: roboshop system user
  - name: remove file in dir
    ansible.builtin.file:
     path: /tmp/shipping.zip
     state: absent   
  - name: remove dir
    ansible.builtin.file:
     path: /app
     state: absent  
  - name: create dir
    ansible.builtin.file:
     path: /app
     state: directory  
  - name: Download package from URL
    ansible.builtin.get_url:
     url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
     dest: /tmp/shipping.zip
  - name: Copy and unzip file 
    ansible.builtin.unarchive:
     src: /tmp/shipping.zip
     dest: /app  
     remote_src: yes
  - name: clean package
    ansible.builtin.command:
     command: mvn clean package
     chdir: /app
  - name: move target file to shipping file
    command: mv target/shipping.jar shipping.jar
    chdir: /app 
  - name: check cities is loaded or not 
    ansible.mysql.mysql_query:
     login_db: cities
     login_user: "{{ mysql_host }}"
     login_password: "{{ mysql_root_password }}"
     query: "SELECT count(*) FROM cities
    register: city_check
    ignore_errors: true

  # - name: Display query result
  #   debug:
  #    msg: "{{ city_check }}"

