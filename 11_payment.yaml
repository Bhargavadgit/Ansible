- name: payment_server
  hosts: payment
  become: yes
  tasks:
  - name: install python
    command: dnf install python3.14 python3.14-pip -y
  - name: user added to payment  
    ansible.builtin.user:
     name: roboshop
     system: yes
     home: /app
     shell: /sbin/nologin
     create_home: false 
     comment: roboshop system user
  - name: remove old dir
    ansible.builtin.file:
     path: /app
     state: absent   
  - name: remove old file
    ansible.builtin.file:
     path: /tmp/payment.zip
     state: absent  
  - name: create dir
    ansible.builtin.file:
     path: /app
     state: directory
  - name: Download file into a directory
    ansible.builtin.get_url:
     url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
     dest: /tmp/payment.zip
  - name: unzip applications
    ansible.builtin.unarchive:
     src: /tmp/payment.zip
     dest: /app 
     remote_src: true
  - name: Install dependencies from requirements.txt into a virtual environment
    ansible.builtin.pip:
     requirements: /app/requirements.txt
     virtualenv: /app/.venv
     virtualenv_command: python3.14 -m venv

  - name: configure payment service
    ansible.builtin.template:
     src: payment.service.j2
     dest: /etc/systemd/system/payment.service
  - name: systemctl daemon-reload
    ansible.builtin.systemd_service:
     daemon_reload: true
  - name:  enable  & start payment
    service:
     name: payment
     state: restarted
     enabled: yes    