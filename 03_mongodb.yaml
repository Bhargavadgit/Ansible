- name: mongoserver_creation
  hosts: mongodb
  become: yes
  tasks:
  - name: copy mongo.repo
    copy:
     src: mongo.repo
     dest: /etc/yum.repos.d/mongo.repo
  - name: Install MongoDB   
    package:
     state: present
     name: mongodb-org
  - name: Start & enable the MongoDB service   
    service:
     name: mongod
     state: started
     enabled: yes
  - name: replace adress in conf file
    replace:
     path: /etc/mongod.conf
     regexp: '127.0.0.1'
     replace: '0.0.0.0'
  - name: reStart the MongoDB service   
    service:
     name: mongod
     state: restarted
     enabled: yes
  - name: print mongo.repo
    debug:
     msg: "{{ mongodb_hosts }}"    


     