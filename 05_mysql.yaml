- name: sqlserver
  hosts: mysql
  become: yes
  tasks:
  - name: By default MySQL 8.0 is installed. Enable 8.4 and install it
    command: dnf module enable mysql:8.4 -y
  - name: install mysql
    package:
      name: mysql-server
      state: present
  - name: enable mysql
    service:
      name: mysqld
      enabled: true
  - name: start mysql
    service:
      name: mysqld
      state: started
# - name: set root password
#   command: mysql_secure_installation --set-root-pass RoboShop@1
# through ansible
  - name: set password through Ansible module
    user:
      name: root
      password: "{{ mysql_secure_installation }}"
# linux user will create password if not exist      
      check_implicit_admin: true
      state: present
          