- name: Front_end
  hosts: frontend 
  become: yes
  tasks:
  - name:  disable nginx
    package: 
     name: nginx
     state: absent
  - name: enable nginx:1.26
    command: dnf module enable nginx:1.26 -y
  - name: install nginx  
    dnf:
     name: nginx
     state: Present
  - name: systemctl enable & start nginx   
    service:
     name: nginx
     state: started
     enabled: yes
  - name: Remove the default content
    ansible.builtin.file:
     path: /usr/share/nginx/html/
     state: absent
  - name: Download and extract the frontend content
    ansible.builtin.get_url:
     url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/frontend-v4.zip
     dest: tmp/frontend.zip
  - name: unzip module
    ansible.builtin.unarchive:
     src: /tmp/frontend.zip
     dest: /usr/share/nginx/html 
  - name: copy file use template to get domains
    ansible.builtin.template:
     src: roboshop.conf
     dest: /etc/nginx/default.d/roboshop.conf
  - name: restart nginx
    service: 
     name: nginx
     state: restarted

 