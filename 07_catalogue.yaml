- name: catalogue_server
  hosts: catalogue
  become: yes
  tasks:
  - name: diable default version
    dnf:
     name: nodejs
     state: absent
  - name: enable nodejs:24 -y 
    command: dnf module enable nodejs:24 -y   
  - name: install nodejs -y
    dnf:
     name: nodejs
     state: present
  - name: add user to catalogue
    ansible.builtin.user:
        name: roboshop
# by defalut it will create /home/user        
        create_home: false         
        home: /app
        system: true
        shell: /sbin/nologin
        comment: roboshop system user
 
  - name: remove existing dir
    ansible.builtin.file:
     path: /app
     state: absent
  - name: remove file
    ansible.builtin.file:
     path: /tmp/catalogue.zip
     state: absent   

  - name: add dir
    file:
     path: /app
     state: directory  

  - name: download application
    ansible.builtin.get_url:
     url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
     dest: /tmp/catalogue.zip
  - name: unZIP files
    ansible.builtin.unarchive:
     src: /tmp/catalogue.zip
     dest: /app
     remote_src: yes   
  - name: Install npm
    community.general.npm:
     path: /app 
# istedy of copy module we are using templete because mongo_host should replace with valve
  - name: configure catalogue.services
    ansible.builtin.template:
     src: catalogue.service.j2
     dest: /etc/systemd/system/catalogue.service
  - name: load master data
    copy:
     src: mongo.repo
     dest: /etc/yum.repos.d/mongo.repo  
  - name: install mongodb-mongosh
    dnf:
     name: mongodb-mongosh
     state: present
  - name: check existing tems available
    command: mongosh --host {{ mongo_host }} --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
    register: items_output
