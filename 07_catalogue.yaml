- name: catalogue_server
  hosts: catalogue
  become: yes
  tasks:
  - name: diable default version
    dnf:
     name: nodejs
     state: absent
  - name: enable nodejs:24 -y 
    command: dnf module enable nodejs:24 -y   
  - name: install nodejs -y
    dnf:
     name: nodejs
     state: present
  - name: add user to catalogue
    ansible.builtin.user:
        name: roboshop
# by defalut it will create /home/user        
        create_home: false         
        home: /app
        system: true
        shell: /sbin/nologin
        comment: roboshop system user
 
  - name: remove existing dir
    ansible.builtin.file:
     path: /app
     state: absent
  - name: remove file
    ansible.builtin.file:
     path: /tmp/catalogue.zip
     state: absent   

  - name: add dir
    file:
     path: /app
     state: directory  

  - name: download application
    ansible.builtin.get_url:
     url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
     dest: /tmp/catalogue.zip
     
  - name: Extract a ZIP file already present on the remote host
    ansible.builtin.unarchive:
     src: /tmp/application.zip
     dest: /opt/myapp/
     remote_src: yes   
               